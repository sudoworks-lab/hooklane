name: Hooklane CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: hooklane-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Quality, security, and chart gates
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Set up pinned Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version-file: .python-version
          check-latest: false
      - name: Bootstrap pinned dependencies and tools
        run: |
          make ci-setup
          printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run local quality, security, and chart gates
        run: make verify

  e2e-kind:
    name: kind delivery and recovery E2E
    needs:
      - quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Set up pinned Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version-file: .python-version
          check-latest: false
      - name: Bootstrap pinned dependencies and tools
        run: |
          make ci-setup
          printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run local kind E2E
        run: make e2e-kind
      - name: Upload sanitized failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hooklane-kind-e2e-diagnostics
          path: artifacts/kind-e2e-*
          if-no-files-found: error
          retention-days: 3
      - name: Clean up project kind cluster
        if: always()
        run: make cluster-down
