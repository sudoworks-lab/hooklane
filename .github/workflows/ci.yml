name: Hooklane CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: hooklane-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Quality, security, and chart gates
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository history
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
      - name: Set up pinned Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version-file: .python-version
          check-latest: false
      - name: Bootstrap pinned dependencies and tools
        run: |
          make ci-setup
          printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run local quality, security, and chart gates
        run: make verify

  e2e-kind:
    name: kind delivery and recovery E2E
    needs:
      - quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository history
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
      - name: Set up pinned Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version-file: .python-version
          check-latest: false
      - name: Bootstrap pinned dependencies and tools
        run: |
          make ci-setup
          printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run local kind E2E
        run: make e2e-kind
      - name: Upload sanitized failure diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: hooklane-kind-e2e-diagnostics
          path: artifacts/kind-e2e-*
          if-no-files-found: error
          retention-days: 3
      - name: Clean up project kind cluster
        if: always()
        run: make cluster-down
