# Local prerequisites: at least 4 CPUs, 8 GiB memory, and 20 GiB free disk.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: kindest/node:v1.34.8@sha256:02722c2dedddcfc00febf5d27fbeb9b7b2c14294c82109ff4a85d89ac9ba3256
    extraPortMappings:
      - containerPort: 30080
        hostPort: 18082
        listenAddress: "127.0.0.1"
        protocol: TCP
