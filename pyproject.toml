[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hooklane"
version = "0.1.1"
description = "Webhook delivery service with retry, recovery, and observability"
requires-python = "==3.12.*"
dependencies = [
  "fastapi==0.139.0",
  "httpx==0.28.1",
  "prometheus-client==0.25.0",
  "pydantic==2.13.4",
  "redis==8.0.1",
  "uvicorn==0.51.0",
]

[dependency-groups]
dev = [
  "mypy==2.2.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pyyaml==6.0.3",
  "ruff==0.15.21",
  "types-pyyaml==6.0.12.20260518",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
strict = true
