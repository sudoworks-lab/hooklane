[project]
name = "hooklane-cloudflare-spike"
version = "0.1.0"
description = "Local-only Cloudflare delivery backend spike for Hooklane"
requires-python = "==3.13.*"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.10.6",
]

[dependency-groups]
dev = [
  "mypy==2.2.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.15.21",
  "uv==0.12.3",
  "workers-py==1.16.5",
  "workers-runtime-sdk==1.6.14",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.13"
strict = true
