name: hooklane-f012

services:
  redis:
    image: redis:8.0.1-alpine@sha256:62b5498c91778f738f0efbf0a6fd5b434011235a3e7b5f2ed4a2c0c63bb1c786
    command: ["redis-server", "--save", "", "--appendonly", "no", "--dir", "/data"]
    user: "999:1000"
    read_only: true
    tmpfs:
      - /data:rw,noexec,nosuid,size=64m,uid=999,gid=1000,mode=0700
      - /tmp:rw,noexec,nosuid,size=16m,uid=999,gid=1000,mode=0700
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 1s
      retries: 30
      start_period: 2s
    ports:
      - "127.0.0.1:16379:6379"

  mock-sink:
    image: hooklane-mock-sink:${IMAGE_TAG:-0.1.1}
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=10001,gid=10001,mode=0700
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/health/live', timeout=1).close()
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 2s
    stop_grace_period: 15s
    networks:
      default:
        aliases: ["hooklane-mock-sink"]

  api:
    image: hooklane-api:${IMAGE_TAG:-0.1.1}
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=10001,gid=10001,mode=0700
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      HOOKLANE_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=1).close()
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 2s
    stop_grace_period: 15s
    ports:
      - "127.0.0.1:18080:8080"

  worker:
    image: hooklane-worker:${IMAGE_TAG:-0.1.1}
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=10001,gid=10001,mode=0700
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      HOOKLANE_CONSUMER_NAME: compose-worker
      HOOKLANE_REDIS_URL: redis://redis:6379/0
      HOOKLANE_DOWNSTREAM_URL: http://hooklane-mock-sink:8080/internal/deliveries
    depends_on:
      mock-sink:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:9090/metrics', timeout=2).close()
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 2s
    stop_grace_period: 15s
