{{- if .Values.observability.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hooklane.fullname" . }}-prometheus-rules
  labels:
    {{- include "hooklane.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
data:
  hooklane-alerts.yml: |
{{ .Files.Get "files/prometheus/rules/hooklane-alerts.yml" | indent 4 }}
{{- end }}
