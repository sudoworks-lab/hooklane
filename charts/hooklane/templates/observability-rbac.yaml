{{- if .Values.observability.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "hooklane.fullname" . }}-prometheus-discovery
  labels:
    {{- include "hooklane.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "hooklane.fullname" . }}-prometheus-discovery
  labels:
    {{- include "hooklane.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "hooklane.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "hooklane.fullname" . }}-prometheus-discovery
{{- end }}
