apiVersion: v1
kind: Service
metadata:
  name: {{ include "hooklane.fullname" . }}-redis
  labels:
    {{- include "hooklane.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  selector:
    {{- include "hooklane.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: {{ .Values.redis.service.port }}
      targetPort: redis
